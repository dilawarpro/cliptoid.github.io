  <rect x="40" y="1335" width="740" height="260" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text class="lbl" x="60" y="1363" fill="#b91c1c">GAPS WE CAN USE</text>
  <text class="l16" x="60" y="1393">• Competitor pages were unreadable; gaps come from Bing results</text>
  <text class="l16" x="60" y="1423">• iPhone searches are answered mostly by publisher guides</text>
  <text class="l16" x="60" y="1453">• No snippet we saw mentions a share menu route</text>
  <text class="l16" x="60" y="1483">• Tool snippets lead with speed claims; we answer with steps</text>
  <text class="l16" x="60" y="1513">• Stating limits (private, expired) builds trust, cuts bounces</text>
  <text class="l16" x="60" y="1543">• Open gap: explain why a saved video can still show a logo</text>

  <rect x="820" y="1335" width="740" height="260" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
